<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaviRoute GPS WebApp</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="relative font-sans antialiased text-slate-800 bg-slate-900">

  <!-- Peta -->
  <div id="map"></div>

  <!-- Panel Kawalan Atas -->
  <div class="absolute top-4 left-4 right-4 md:left-6 md:w-96 z-[1000] flex flex-col gap-2">
    <div class="p-4 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200">
      
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-blue-600 rounded-xl text-white">
            <i data-lucide="navigation" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-sm text-slate-900">NaviRoute GPS</h1>
            <p class="text-[10px] text-slate-500">OSRM & OpenStreetMap</p>
          </div>
        </div>

        <!-- Mod Kenderaan -->
        <div class="flex bg-slate-100 p-1 rounded-xl text-xs gap-1">
          <button id="btn-car" onclick="setMode('driving')" class="p-1.5 rounded-lg bg-white shadow text-blue-600">
            <i data-lucide="car" class="w-4 h-4"></i>
          </button>
          <button id="btn-bike" onclick="setMode('cycling')" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900">
            <i data-lucide="bike" class="w-4 h-4"></i>
          </button>
          <button id="btn-walk" onclick="setMode('walking')" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900">
            <i data-lucide="footprints" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Input Mula & Destinasi -->
      <div class="flex flex-col gap-2 relative">
        <div class="relative">
          <input id="input-origin" type="text" placeholder="Pilih Titik Mula atau guna GPS..."
            class="w-full text-xs bg-slate-50 rounded-xl px-3 py-2 pr-16 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div class="absolute right-1 top-1.5 flex items-center">
            <button onclick="getCurrentLocation()" title="Guna Lokasi GPS Semasa" class="p-1 text-blue-600 hover:bg-blue-50 rounded-md">
              <i data-lucide="locate-fixed" class="w-4 h-4"></i>
            </button>
            <button onclick="setPinTarget('origin')" title="Klik peta untuk titik mula" class="p-1 text-slate-400 hover:text-emerald-600 rounded-md">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="origin-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-lg border border-slate-100 hidden z-50 max-h-40 overflow-y-auto"></div>
        </div>

        <div class="relative">
          <input id="input-dest" type="text" placeholder="Cari destinasi..."
            class="w-full text-xs bg-slate-50 rounded-xl px-3 py-2 pr-10 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div class="absolute right-1 top-1.5 flex items-center">
            <button onclick="setPinTarget('dest')" title="Klik peta untuk destinasi" class="p-1 text-slate-400 hover:text-rose-600 rounded-md">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="dest-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-lg border border-slate-100 hidden z-50 max-h-40 overflow-y-auto"></div>
        </div>
      </div>

      <div id="pin-notice" class="mt-2 text-[11px] text-amber-600 font-semibold hidden">
        Sila klik pada mana-mana kawasan di atas peta...
      </div>

      <!-- Butang Kira Laluan -->
      <button onclick="calculateRoute()" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-xs py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
        <i data-lucide="compass" class="w-4 h-4"></i> Cari Laluan
      </button>

      <div id="error-box" class="mt-2 text-xs text-rose-600 hidden"></div>
    </div>
  </div>

  <!-- Panel Status Bawah (Maklumat Laluan) -->
  <div id="bottom-panel" class="absolute bottom-6 left-4 right-4 md:left-6 md:w-96 z-[1000] hidden">
    <div class="bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-xl border border-slate-200">
      <div class="flex items-center justify-between">
        <div>
          <span id="route-duration" class="text-lg font-black text-slate-900 block">-- min</span>
          <span id="route-distance" class="text-xs text-slate-500 font-medium">-- km</span>
        </div>
        <button onclick="startNavigation()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 shadow">
          <i data-lucide="play" class="w-4 h-4 fill-white"></i> Mula Navigasi
        </button>
      </div>
    </div>
  </div>

  <!-- Skrip Logik Navigasi -->
  <script>
    lucide.createIcons();

    // 1. Inisialisasi Peta Leaflet (Pusat default: Kuala Lumpur)
    const map = L.map('map', { zoomControl: false }).setView([3.1390, 101.6869], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let originCoords = null;
    let destCoords = null;
    let originMarker = null;
    let destMarker = null;
    let routeLayer = null;
    let transportMode = 'driving';
    let pinTarget = null;

    // 2. Klik pada peta untuk tetapkan titik
    map.on('click', (e) => {
      if (!pinTarget) return;
      const { lat, lng } = e.latlng;
      if (pinTarget === 'origin') {
        originCoords = { lat, lon: lng };
        document.getElementById('input-origin').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        setMarker('origin', lat, lng, '#10b981');
      } else if (pinTarget === 'dest') {
        destCoords = { lat, lon: lng };
        document.getElementById('input-dest').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        setMarker('dest', lat, lng, '#ef4444');
      }
      pinTarget = null;
      document.getElementById('pin-notice').classList.add('hidden');
    });

    function setPinTarget(type) {
      pinTarget = type;
      const notice = document.getElementById('pin-notice');
      notice.textContent = `Klik pada peta untuk menetapkan titik ${type === 'origin' ? 'MULA' : 'DESTINASI'}`;
      notice.classList.remove('hidden');
    }

    function setMarker(type, lat, lon, color) {
      const icon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background-color: ${color}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white;"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      if (type === 'origin') {
        if (originMarker) map.removeLayer(originMarker);
        originMarker = L.marker([lat, lon], { icon }).addTo(map);
      } else {
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker([lat, lon], { icon }).addTo(map);
      }
    }

    function setMode(mode) {
      transportMode = mode;
      ['car', 'bike', 'walk'].forEach(m => {
        document.getElementById(`btn-${m}`).className = 'p-1.5 rounded-lg text-slate-500 hover:text-slate-900';
      });
      const activeBtn = mode === 'driving' ? 'car' : mode === 'cycling' ? 'bike' : 'walk';
      document.getElementById(`btn-${activeBtn}`).className = 'p-1.5 rounded-lg bg-white shadow text-blue-600';
    }

    // 3. Ambil Lokasi GPS Semasa Pengguna
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        showError('Pelayar web tidak menyokong GPS.');
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        originCoords = { lat: latitude, lon: longitude };
        document.getElementById('input-origin').value = 'Lokasi Semasa Saya';
        setMarker('origin', latitude, longitude, '#10b981');
        map.flyTo([latitude, longitude], 15);
      }, () => {
        showError('Sila berikan kebenaran GPS / Lokasi.');
      }, { enableHighAccuracy: true });
    }

    // 4. Cari Alamat Menggunakan Nominatim API
    function setupSearch(inputId, suggestionsId, isOrigin) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(suggestionsId);

      input.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 3) {
          list.classList.add('hidden');
          return;
        }
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=4`);
          const data = await res.json();
          list.innerHTML = '';
          if (data.length > 0) {
            list.classList.remove('hidden');
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'px-3 py-2 text-xs hover:bg-blue-50 cursor-pointer border-b border-slate-100 truncate';
              div.textContent = item.display_name;
              div.onclick = () => {
                input.value = item.display_name;
                const coords = { lat: parseFloat(item.lat), lon: parseFloat(item.lon) };
                if (isOrigin) {
                  originCoords = coords;
                  setMarker('origin', coords.lat, coords.lon, '#10b981');
                } else {
                  destCoords = coords;
                  setMarker('dest', coords.lat, coords.lon, '#ef4444');
                }
                list.classList.add('hidden');
              };
              list.appendChild(div);
            });
          }
        } catch (err) {}
      });
    }

    setupSearch('input-origin', 'origin-suggestions', true);
    setupSearch('input-dest', 'dest-suggestions', false);

    // 5. Kira Laluan Menggunakan OSRM
    async function calculateRoute() {
      if (!originCoords || !destCoords) {
        showError('Sila pilih titik mula dan destinasi.');
        return;
      }
      showError('');

      const profile = transportMode === 'walking' ? 'foot' : transportMode === 'cycling' ? 'bike' : 'driving';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${originCoords.lon},${originCoords.lat};${destCoords.lon},${destCoords.lat}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        if (!json.routes || json.routes.length === 0) {
          showError('Tiada laluan dijumpai.');
          return;
        }

        const route = json.routes[0];
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(coords, { color: '#2563eb', weight: 6, opacity: 0.8 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        // Paparkan Maklumat Masa & Jarak
        const mins = Math.round(route.duration / 60);
        const km = (route.distance / 1000).toFixed(1);
        document.getElementById('route-duration').textContent = `${mins} minit`;
        document.getElementById('route-distance').textContent = `${km} km`;
        document.getElementById('bottom-panel').classList.remove('hidden');

      } catch (err) {
        showError('Gagal menyambung ke pelayan laluan.');
      }
    }

    function startNavigation() {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance('Navigasi dimulakan. Teruskan perjalanan anda.');
        utterance.lang = 'ms-MY';
        window.speechSynthesis.speak(utterance);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-box');
      if (!msg) {
        el.classList.add('hidden');
      } else {
        el.textContent = msg;
        el.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jalan-Jalan - InsyaAllah Sampai</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .pulse-ring {
      border: 3px solid #2563eb;
      border-radius: 50%;
      height: 48px;
      width: 48px;
      position: absolute;
      left: -14px;
      top: -14px;
      animation: pulsate 1.5s ease-out infinite;
      opacity: 0;
    }
    @keyframes pulsate {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .car-marker-container {
      transition: transform 0.3s linear;
    }
  </style>
</head>
<body class="relative font-sans antialiased text-slate-900 bg-slate-950">

  <!-- Peta Leaflet -->
  <div id="map"></div>

  <!-- 1. HUD ARAHAN ATAS (Masa Navigasi Aktif) -->
  <div id="nav-hud" class="hidden absolute top-4 left-4 right-4 md:left-6 md:w-96 z-[1100]">
    <div class="bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-slate-700">
      <div class="flex items-center gap-3">
        <div id="hud-maneuver-icon" class="bg-blue-600 p-3 rounded-2xl text-white shadow-lg flex items-center justify-center">
          <i data-lucide="arrow-up" class="w-7 h-7"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div id="hud-distance" class="text-xl font-black text-blue-400">0 m</div>
          <div id="hud-instruction" class="text-sm font-semibold truncate">Teruskan di laluan anda</div>
        </div>
        <button onclick="toggleVoice()" id="btn-voice" class="p-2 bg-slate-800 text-blue-400 rounded-xl" title="Suara">
          <i data-lucide="volume-2" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. BUTANG RE-CENTER (Muncul semasa peta dileret keluar dari fokus kenderaan) -->
  <button id="btn-recenter" onclick="recenterMap()" class="hidden absolute bottom-28 right-4 z-[1050] bg-white text-blue-600 p-3.5 rounded-full shadow-2xl border border-slate-200 active:scale-90 transition-all flex items-center gap-2 font-bold text-xs">
    <i data-lucide="locate" class="w-5 h-5 text-blue-600"></i>
    <span class="pr-1 text-slate-800">Center Semula</span>
  </button>

  <!-- 3. PANEL INPUT & CARIAN (Sebelum Navigasi) -->
  <div id="search-panel" class="absolute top-4 left-4 right-4 md:left-6 md:w-96 z-[1000] flex flex-col gap-2">
    <div class="p-4 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200">
      
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-blue-600 rounded-xl text-white">
            <i data-lucide="navigation" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="font-bold text-sm text-slate-900">Jalan-Jalan</h1>
            <p class="text-[10px] text-slate-500">Panduan Masa Nyata</p>
          </div>
        </div>

        <div class="flex bg-slate-100 p-1 rounded-xl text-xs gap-1">
          <button id="btn-car" onclick="setMode('driving')" class="p-1.5 rounded-lg bg-white shadow text-blue-600"><i data-lucide="car" class="w-4 h-4"></i></button>
          <button id="btn-bike" onclick="setMode('cycling')" class="p-1.5 rounded-lg text-slate-500"><i data-lucide="bike" class="w-4 h-4"></i></button>
          <button id="btn-walk" onclick="setMode('walking')" class="p-1.5 rounded-lg text-slate-500"><i data-lucide="footprints" class="w-4 h-4"></i></button>
        </div>
      </div>

      <!-- Input Mula & Destinasi -->
      <div class="flex flex-col gap-2 relative">
        <div class="relative">
          <input id="input-origin" type="text" placeholder="Titik mula atau klik GPS..."
            class="w-full text-xs bg-slate-50 rounded-xl px-3 py-2.5 pr-16 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div class="absolute right-1 top-1.5 flex items-center">
            <button onclick="getCurrentLocation()" title="Guna GPS" class="p-1 text-blue-600 hover:bg-blue-50 rounded-md">
              <i data-lucide="locate-fixed" class="w-4 h-4"></i>
            </button>
            <button onclick="setPinTarget('origin')" title="Pin di peta" class="p-1 text-slate-400 hover:text-emerald-600 rounded-md">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="origin-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-lg border border-slate-100 hidden z-50 max-h-40 overflow-y-auto"></div>
        </div>

        <div class="relative">
          <input id="input-dest" type="text" placeholder="Cari destinasi..."
            class="w-full text-xs bg-slate-50 rounded-xl px-3 py-2.5 pr-10 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div class="absolute right-1 top-1.5 flex items-center">
            <button onclick="setPinTarget('dest')" title="Pin di peta" class="p-1 text-slate-400 hover:text-rose-600 rounded-md">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="dest-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-lg border border-slate-100 hidden z-50 max-h-40 overflow-y-auto"></div>
        </div>
      </div>

      <div id="pin-notice" class="mt-2 text-[11px] text-amber-600 font-semibold hidden">
        Sila klik mana-mana lokasi atas peta...
      </div>

      <button onclick="calculateRoute()" id="btn-calc" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-xs py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2">
        <i data-lucide="compass" class="w-4 h-4"></i> Cari Laluan
      </button>

      <div id="error-box" class="mt-2 text-xs text-rose-600 hidden"></div>
    </div>
  </div>

  <!-- 4. PANEL BAWAH (Ringkasan & Butang Navigasi) -->
  <div id="bottom-panel" class="absolute bottom-6 left-4 right-4 md:left-6 md:w-96 z-[1000] hidden">
    <div class="bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between mb-3">
        <div>
          <span id="route-duration" class="text-xl font-black text-slate-900 block">-- min</span>
          <span id="route-distance" class="text-xs text-slate-500 font-medium">-- km</span>
        </div>
        <div class="text-right">
          <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider block">Jangkaan Tiba</span>
          <span id="route-eta" class="text-xs font-semibold text-slate-700">--:--</span>
        </div>
      </div>

      <!-- Pilihan Mod Bergerak -->
      <div id="nav-actions" class="grid grid-cols-2 gap-2">
        <button onclick="startNavigation('simulation')" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow">
          <i data-lucide="play" class="w-4 h-4 fill-white"></i> Simulasi Kereta
        </button>
        <button onclick="startNavigation('realtime')" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xs py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow">
          <i data-lucide="navigation" class="w-4 h-4 fill-white"></i> Jom Bergerak
        </button>
      </div>

      <button id="btn-stop-nav" onclick="stopNavigation()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs py-2.5 rounded-xl hidden items-center justify-center gap-2 shadow">
        <i data-lucide="square" class="w-4 h-4 fill-white"></i> Tamatkan Navigasi
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Inisialisasi Peta Leaflet
    const map = L.map('map', { zoomControl: false }).setView([3.1390, 101.6869], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let originCoords = null;
    let destCoords = null;
    let originMarker = null;
    let destMarker = null;
    let routeLayer = null;
    let transportMode = 'driving';
    let pinTarget = null;

    // Data Perjalanan & Navigasi
    let routeCoords = [];
    let routeSteps = [];
    let vehicleMarker = null;
    let currentVehicleLatLng = null;
    let currentBearing = 0;
    let simTimer = null;
    let watchId = null;
    let isNavigating = false;
    let voiceEnabled = true;

    // Tetapan Auto-Center
    let isAutoCenter = true;

    // Kesan sentuhan atau leretan jari pengguna di atas peta
    map.on('dragstart', () => {
      if (isNavigating) {
        isAutoCenter = false;
        showRecenterButton(true);
      }
    });

    function showRecenterButton(show) {
      const btn = document.getElementById('btn-recenter');
      if (show) {
        btn.classList.remove('hidden');
        btn.classList.add('flex');
      } else {
        btn.classList.add('hidden');
        btn.classList.remove('flex');
      }
    }

    // Fungsi Pusat Semula (Re-center)
    function recenterMap() {
      isAutoCenter = true;
      showRecenterButton(false);
      if (currentVehicleLatLng) {
        map.flyTo(currentVehicleLatLng, 17, { animate: true, duration: 0.8 });
      }
    }

    // Klik Peta untuk Tetapkan Pin
    map.on('click', (e) => {
      if (!pinTarget) return;
      const { lat, lng } = e.latlng;
      if (pinTarget === 'origin') {
        originCoords = { lat, lon: lng };
        document.getElementById('input-origin').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        setMarker('origin', lat, lng, '#10b981');
      } else if (pinTarget === 'dest') {
        destCoords = { lat, lon: lng };
        document.getElementById('input-dest').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        setMarker('dest', lat, lng, '#ef4444');
      }
      pinTarget = null;
      document.getElementById('pin-notice').classList.add('hidden');
    });

    function setPinTarget(type) {
      pinTarget = type;
      const notice = document.getElementById('pin-notice');
      notice.textContent = `Klik pada peta untuk menetapkan titik ${type === 'origin' ? 'MULA' : 'DESTINASI'}`;
      notice.classList.remove('hidden');
    }

    function setMarker(type, lat, lon, color) {
      const icon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background-color: ${color}; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.4);"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });

      if (type === 'origin') {
        if (originMarker) map.removeLayer(originMarker);
        originMarker = L.marker([lat, lon], { icon }).addTo(map);
      } else {
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker([lat, lon], { icon }).addTo(map);
      }
    }

    function setMode(mode) {
      transportMode = mode;
      ['car', 'bike', 'walk'].forEach(m => {
        document.getElementById(`btn-${m}`).className = 'p-1.5 rounded-lg text-slate-500';
      });
      const activeBtn = mode === 'driving' ? 'car' : mode === 'cycling' ? 'bike' : 'walk';
      document.getElementById(`btn-${activeBtn}`).className = 'p-1.5 rounded-lg bg-white shadow text-blue-600';
    }

    function getCurrentLocation() {
      if (!navigator.geolocation) {
        showError('Pelayar web tidak menyokong GPS.');
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        originCoords = { lat: latitude, lon: longitude };
        document.getElementById('input-origin').value = 'Lokasi Semasa Saya';
        setMarker('origin', latitude, longitude, '#10b981');
        map.flyTo([latitude, longitude], 15);
      }, () => {
        showError('Sila berikan kebenaran GPS.');
      }, { enableHighAccuracy: true });
    }

    // Carian Geocoding
    function setupSearch(inputId, suggestionsId, isOrigin) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(suggestionsId);

      input.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        if (query.length < 3) {
          list.classList.add('hidden');
          return;
        }
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=4`);
          const data = await res.json();
          list.innerHTML = '';
          if (data.length > 0) {
            list.classList.remove('hidden');
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'px-3 py-2 text-xs hover:bg-blue-50 cursor-pointer border-b border-slate-100 truncate';
              div.textContent = item.display_name;
              div.onclick = () => {
                input.value = item.display_name;
                const coords = { lat: parseFloat(item.lat), lon: parseFloat(item.lon) };
                if (isOrigin) {
                  originCoords = coords;
                  setMarker('origin', coords.lat, coords.lon, '#10b981');
                } else {
                  destCoords = coords;
                  setMarker('dest', coords.lat, coords.lon, '#ef4444');
                }
                list.classList.add('hidden');
              };
              list.appendChild(div);
            });
          }
        } catch (err) {}
      });
    }

    setupSearch('input-origin', 'origin-suggestions', true);
    setupSearch('input-dest', 'dest-suggestions', false);

    // Kira Laluan Menggunakan OSRM
    async function calculateRoute() {
      if (!originCoords || !destCoords) {
        showError('Sila pilih titik mula dan destinasi.');
        return;
      }
      showError('');

      const btn = document.getElementById('btn-calc');
      btn.innerHTML = `<span class="animate-spin">⌛</span> Mengira Laluan...`;

      const profile = transportMode === 'walking' ? 'foot' : transportMode === 'cycling' ? 'bike' : 'driving';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${originCoords.lon},${originCoords.lat};${destCoords.lon},${destCoords.lat}?overview=full&geometries=geojson&steps=true`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        btn.innerHTML = `<i data-lucide="compass" class="w-4 h-4"></i> Cari Laluan`;
        lucide.createIcons();

        if (!json.routes || json.routes.length === 0) {
          showError('Tiada laluan dijumpai.');
          return;
        }

        const route = json.routes[0];
        routeCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        routeSteps = [];
        route.legs.forEach(leg => {
          leg.steps.forEach(st => {
            routeSteps.push({
              instruction: st.maneuver.instruction || (st.maneuver.type + ' ' + (st.maneuver.modifier || '')),
              distance: st.distance,
              location: [st.maneuver.location[1], st.maneuver.location[0]],
              modifier: st.maneuver.modifier || 'straight'
            });
          });
        });

        if (routeLayer) map.removeLayer(routeLayer);
        routeLayer = L.polyline(routeCoords, { color: '#2563eb', weight: 6, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

        const mins = Math.round(route.duration / 60);
        const km = (route.distance / 1000).toFixed(1);
        document.getElementById('route-duration').textContent = `${mins} minit`;
        document.getElementById('route-distance').textContent = `${km} km`;
        
        const etaDate = new Date(Date.now() + route.duration * 1000);
        document.getElementById('route-eta').textContent = etaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        document.getElementById('bottom-panel').classList.remove('hidden');
      } catch (err) {
        btn.innerHTML = `<i data-lucide="compass" class="w-4 h-4"></i> Cari Laluan`;
        lucide.createIcons();
        showError('Ralat sambungan ke pelayan perutean OSRM.');
      }
    }

    // Kira Bearing Sudut Arah
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => (deg * Math.PI) / 180;
      const toDeg = rad => (rad * 180) / Math.PI;

      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      const brng = toDeg(Math.atan2(y, x));
      return (brng + 360) % 360;
    }

    // Cipta atau Kemas kini Marker Kenderaan
    function updateVehicleMarker(lat, lon, angle = 0) {
      currentVehicleLatLng = [lat, lon];
      currentBearing = angle;

      if (!vehicleMarker) {
        const carIcon = L.divIcon({
          className: 'custom-vehicle-icon',
          html: `
            <div style="position: relative; width: 44px; height: 44px;">
              <div class="pulse-ring"></div>
              <div id="car-symbol" class="car-marker-container" style="transform: rotate(${angle}deg); width: 44px; height: 44px; background: #1e40af; border: 3px solid white; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; color: white;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                </svg>
              </div>
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });
        vehicleMarker = L.marker([lat, lon], { icon: carIcon }).addTo(map);
      } else {
        vehicleMarker.setLatLng([lat, lon]);
        const carEl = document.getElementById('car-symbol');
        if (carEl) {
          carEl.style.transform = `rotate(${angle}deg)`;
        }
      }

      // Hanya bawa kamera jika isAutoCenter masih aktif
      if (isAutoCenter) {
        map.panTo([lat, lon], { animate: true, duration: 0.5 });
      }
    }

    // Mula Navigasi
    function startNavigation(type) {
      if (routeCoords.length === 0) return;

      isNavigating = true;
      isAutoCenter = true;
      showRecenterButton(false);

      document.getElementById('search-panel').classList.add('hidden');
      document.getElementById('nav-actions').classList.add('hidden');
      document.getElementById('btn-stop-nav').classList.remove('hidden');
      document.getElementById('btn-stop-nav').classList.add('flex');
      document.getElementById('nav-hud').classList.remove('hidden');

      speakVoice('Navigasi dimulakan. Ikuti laluan.');

      map.setZoom(17);

      if (type === 'simulation') {
        runSimulation();
      } else {
        runRealtimeGPS();
      }
    }

    // Simulasi Pergerakan Kereta
    function runSimulation() {
      let index = 0;
      let currentStepIdx = 0;

      simTimer = setInterval(() => {
        if (index >= routeCoords.length - 1) {
          clearInterval(simTimer);
          speakVoice('Anda telah sampai ke destinasi.');
          updateHUD('Sampai ke Destinasi', '0 m');
          return;
        }

        const curr = routeCoords[index];
        const next = routeCoords[index + 1];
        const bearing = calculateBearing(curr[0], curr[1], next[0], next[1]);

        updateVehicleMarker(curr[0], curr[1], bearing);

        if (routeSteps[currentStepIdx]) {
          const step = routeSteps[currentStepIdx];
          updateHUD(step.instruction, `${Math.round(step.distance)} m`);
          if (index % 6 === 0 && voiceEnabled) {
            speakVoice(step.instruction);
          }
          if (index > (currentStepIdx + 1) * (routeCoords.length / routeSteps.length)) {
            currentStepIdx++;
          }
        }

        index++;
      }, 700);
    }

    // Penjejakan GPS Masa Nyata
    function runRealtimeGPS() {
      if (!navigator.geolocation) {
        showError('Peranti tidak menyokong penjejakan GPS.');
        return;
      }

      watchId = navigator.geolocation.watchPosition((pos) => {
        const { latitude, longitude, heading } = pos.coords;
        const angle = heading || currentBearing;
        updateVehicleMarker(latitude, longitude, angle);
      }, (err) => {
        console.error(err);
      }, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 5000
      });
    }

    // Tamatkan Navigasi
    function stopNavigation() {
      isNavigating = false;
      isAutoCenter = true;
      showRecenterButton(false);

      if (simTimer) clearInterval(simTimer);
      if (watchId) navigator.geolocation.clearWatch(watchId);

      if (vehicleMarker) {
        map.removeLayer(vehicleMarker);
        vehicleMarker = null;
      }

      document.getElementById('nav-hud').classList.add('hidden');
      document.getElementById('search-panel').classList.remove('hidden');
      document.getElementById('nav-actions').classList.remove('hidden');
      document.getElementById('btn-stop-nav').classList.add('hidden');
      document.getElementById('btn-stop-nav').classList.remove('flex');

      if (routeLayer) map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    }

    function updateHUD(instruction, distText) {
      document.getElementById('hud-instruction').textContent = instruction;
      document.getElementById('hud-distance').textContent = distText;
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('btn-voice');
      btn.className = voiceEnabled ? 'p-2 bg-slate-800 text-blue-400 rounded-xl' : 'p-2 bg-slate-800 text-slate-500 rounded-xl';
    }

    function speakVoice(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ms-MY';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function showError(msg) {
      const el = document.getElementById('error-box');
      if (!msg) {
        el.classList.add('hidden');
      } else {
        el.textContent = msg;
        el.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
